name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: install dependencies
        run: npm ci
      - name: verify tag and package version
        run: node -e 'const version=require("./package.json").version; if (process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error(`tag ${process.env.GITHUB_REF_NAME} does not match v${version}`)'
      - name: type-check
        run: npm run check
      - name: test
        run: npm test
      - name: test packed installation
        run: npm run test:package
      - name: build release artifacts
        run: npm run package:npm
      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: artifacts/*
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts
      - name: attest package provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/*.tgz
      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --generate-notes
